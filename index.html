<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Biblioteca de Vídeos de Produtos — Unifort</title>

<style>
/* ===== SEU CSS ORIGINAL (mantido) ===== */
:root{
  --bg:#070b14;
  --panel:rgba(255,255,255,.03);
  --card:rgba(255,255,255,.03);
  --muted:#9aa6b2;
  --text:#e8eef5;
  --line:rgba(255,255,255,.08);
  --brand:#83b951;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}
.container{max-width:1240px;margin:0 auto;padding:28px 18px 56px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.thumb{height:150px;background:#111;width:100%;object-fit:cover}
.cardBody{padding:12px}
.title{margin:0;font-size:16px}
.desc{margin:6px 0 12px;color:var(--muted);font-size:13px}
.codigo{font-size:12px;color:#83b951;margin-top:4px}
.search input{
  width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
  background:#111;color:#fff;
}
</style>
</head>

<body>
<div class="container">

  <div class="search">
    <input id="q" placeholder="Buscar por produto ou código (ex: 99BR)" />
  </div>

  <div class="grid" id="grid"></div>

</div>

<script>
const elGrid = document.getElementById("grid");
const elQ = document.getElementById("q");

let DATA = [];

function matches(item){
  const q = (elQ.value || "").trim().toLowerCase();

  const qOk = !q
    || (item.produto||"").toLowerCase().includes(q)
    || (item.descricao||"").toLowerCase().includes(q)
    || (item.codigo||"").toLowerCase().includes(q); // 👈 AQUI ESTÁ A BUSCA POR CÓDIGO

  return qOk;
}

function card(item){
  const wrap = document.createElement("div");
  wrap.className = "card";

  const img = document.createElement("img");
  img.className = "thumb";
  img.src = item.imagem || "";
  img.alt = item.produto || "";
  img.loading = "lazy";
  wrap.appendChild(img);

  const body = document.createElement("div");
  body.className = "cardBody";

  const h = document.createElement("h3");
  h.className = "title";
  h.textContent = item.produto || "";

  const codigo = document.createElement("div");
  codigo.className = "codigo";
  codigo.textContent = "Código: " + (item.codigo || "—");

  const p = document.createElement("p");
  p.className = "desc";
  p.textContent = item.descricao || "";

  body.appendChild(h);
  body.appendChild(codigo); // 👈 Mostra o código no card
  body.appendChild(p);

  wrap.appendChild(body);
  return wrap;
}

function render(){
  elGrid.innerHTML = "";
  const filtered = DATA.filter(matches);
  filtered.forEach(item=> elGrid.appendChild(card(item)));
}

async function init(){
  const res = await fetch("videos.json");
  DATA = await res.json();
  render();
}

elQ.addEventListener("input", render);

init();
</script>

</body>
</html>
