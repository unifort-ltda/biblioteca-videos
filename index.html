<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Biblioteca de Vídeos de Produtos — Unifort</title>
<meta property="og:title" content="Biblioteca de Vídeos de Produtos — Unifort" />
<meta property="og:description" content="Acervo oficial para o time comercial: encontre, assista, baixe e compartilhe vídeos de produtos Unifort." />
<meta property="og:image" content="https://unifort-ltda.github.io/biblioteca-videos/capa-compartilhamento.png" />
<meta property="og:url" content="https://unifort-ltda.github.io/biblioteca-videos/" />
<meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#070b14;
      --panel:rgba(255,255,255,.03);
      --card:rgba(255,255,255,.03);
      --muted:#9aa6b2;
      --text:#e8eef5;
      --line:rgba(255,255,255,.08);
      --brand:#83b951;
      --chip:rgba(255,255,255,.08);
      --btn:rgba(255,255,255,.08);
      --btnHover:rgba(255,255,255,.14);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(131,185,81,.18), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, rgba(120,130,255,.10), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    .container{max-width:1240px;margin:0 auto;padding:28px 18px 56px}

    header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .logo{
      width:46px;height:46px;border-radius:12px;
      background: linear-gradient(135deg, rgba(131,185,81,.35), rgba(131,185,81,.08));
      border:1px solid var(--line);
      display:grid;place-items:center;overflow:hidden;
    }
    .logo img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
    h1{font-size:26px;margin:0 0 2px 0;letter-spacing:.2px}
    .sub{margin:0;color:var(--muted);font-size:14px}

    .toolbar{
      display:flex;flex-wrap:wrap;gap:10px;align-items:center;
      background: var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      margin:16px 0 14px;
      backdrop-filter: blur(8px);
    }
    .search{
      flex:1;min-width:230px;
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:12px;
      background: rgba(0,0,0,.18);
      border:1px solid var(--line);
    }
    .search input{
      width:100%;
      background:transparent;border:none;outline:none;
      color:var(--text);font-size:14px;
    }
    select{
      padding:10px 12px;border-radius:12px;
      background: rgba(0,0,0,.18);
      border:1px solid var(--line);
      color:var(--text);
      font-size:14px;
      outline:none;
      min-width:220px;
    }

    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
    .tab{
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      color:var(--text);
      cursor:pointer;
      font-size:13px;
      user-select:none;
    }
    .tab.active{
      background: rgba(131,185,81,.16);
      border-color: rgba(131,185,81,.35);
      box-shadow: 0 10px 30px rgba(131,185,81,.12);
    }

    .metaRow{display:flex;justify-content:flex-end;margin:-4px 0 10px}
    .count{
      font-size:12px;color:var(--muted);
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      padding:6px 10px;border-radius:999px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width:1100px){.grid{grid-template-columns: repeat(3, 1fr)}}
    @media (max-width:820px){.grid{grid-template-columns: repeat(2, 1fr)}}
    @media (max-width:520px){.grid{grid-template-columns: 1fr}}

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.25);
    }
    .thumb{
      height:150px;
      background: rgba(0,0,0,.18);
      border-bottom: 1px solid var(--line);
      display:block;width:100%;
      object-fit:cover;
    }
    .thumb.placeholder{
      background: linear-gradient(135deg, rgba(131,185,81,.18), rgba(255,255,255,.04));
    }

    .cardBody{padding:12px 12px 14px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .chip{
      font-size:12px;color:#cfe3f6;
      background: var(--chip);
      border:1px solid var(--line);
      padding:5px 8px;border-radius:999px;
    }
    .title{margin:0;font-size:16px}
    .desc{margin:6px 0 12px;color:var(--muted);font-size:13px;line-height:1.25}

    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line);
      background: var(--btn);
      color:var(--text);
      border-radius:999px;
      padding:8px 10px;
      font-size:13px;
      cursor:pointer;
      display:inline-flex;
      gap:8px;
      align-items:center;
      text-decoration:none;
    }
    .btn:hover{background:var(--btnHover)}
    .btn.primary{
      background: rgba(131,185,81,.18);
      border-color: rgba(131,185,81,.35);
    }

    .toast{
      position:fixed;
      bottom:18px;left:50%;transform:translateX(-50%);
      background: rgba(20,28,44,.92);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      backdrop-filter: blur(10px);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="logo-unifort.png" alt="Unifort" />
      </div>
      <div>
        <h1>Biblioteca de Vídeos de Produtos — Unifort</h1>
        <p class="sub">Acervo oficial para o time comercial: encontre, assista, baixe e compartilhe.</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <span style="opacity:.8">🔎</span>
        <input id="q" placeholder="Buscar por produto (ex: limpa freio)" />
      </div>

      <select id="cat">
        <option value="">Todas as categorias</option>
      </select>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="metaRow"><div class="count" id="count">0 vídeo(s)</div></div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast">Copiado!</div>

  <script>
    const SEGMENTOS = ["Todos","Automóveis","Motos","Pesada","Ferramentas","Organização","Estética Automotiva","Químicos","Utilidades"];

    const elGrid = document.getElementById("grid");
    const elTabs = document.getElementById("tabs");
    const elQ = document.getElementById("q");
    const elCat = document.getElementById("cat");
    const elCount = document.getElementById("count");
    const toast = document.getElementById("toast");

    let DATA = [];
    let activeSegmento = "Todos";

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window.__t);
      window.__t = setTimeout(()=>toast.classList.remove("show"), 1400);
    }

    function unique(arr){ return [...new Set(arr)].filter(Boolean).sort((a,b)=>a.localeCompare(b,"pt-BR")); }

    function buildTabs(){
      elTabs.innerHTML = "";
      SEGMENTOS.forEach(seg=>{
        const b = document.createElement("div");
        b.className = "tab" + (seg===activeSegmento ? " active":"");
        b.textContent = seg;
        b.onclick = ()=>{ activeSegmento = seg; buildTabs(); render(); };
        elTabs.appendChild(b);
      });
    }

    function buildCategoryOptions(){
      const cats = unique(DATA.map(x=>x.categoria));
      elCat.innerHTML = `<option value="">Todas as categorias</option>` + cats.map(c=>`<option value="${c}">${c}</option>`).join("");
    }

    function matches(item){
      const q = (elQ.value || "").trim().toLowerCase();
      const cat = elCat.value || "";
      const segOk = activeSegmento==="Todos" || (item.segmento===activeSegmento);
      const catOk = !cat || item.categoria===cat;
      const qOk = !q || (item.produto||"").toLowerCase().includes(q) || (item.descricao||"").toLowerCase().includes(q);
      return segOk && catOk && qOk;
    }

    function card(item){
      const wrap = document.createElement("div");
      wrap.className = "card";

      // imagem com fallback
      const img = document.createElement("img");
      img.className = "thumb";
      img.src = item.imagem || "";
      img.alt = item.produto || "";
      img.loading = "lazy";
      img.onerror = () => {
        img.remove();
        const ph = document.createElement("div");
        ph.className = "thumb placeholder";
        wrap.prepend(ph);
      };
      wrap.appendChild(img);

      const body = document.createElement("div");
      body.className = "cardBody";

      const chips = document.createElement("div");
      chips.className = "chips";
      chips.innerHTML = `
        <span class="chip">${item.segmento || "—"}</span>
        <span class="chip">${item.categoria || "—"}</span>
      `;

      const h = document.createElement("h3");
      h.className = "title";
      h.textContent = item.produto || "Produto";

      const p = document.createElement("p");
      p.className = "desc";
      p.textContent = item.descricao || "";

      const actions = document.createElement("div");
      actions.className = "actions";

      const a1 = document.createElement("a");
      a1.className = "btn primary";
      a1.href = item.assistente || "#";
      a1.target = "_blank";
      a1.rel = "noopener";
      a1.textContent = "▶ Assistir";

      const a2 = document.createElement("a");
      a2.className = "btn";
      a2.href = item.baixar || "#";
      a2.target = "_blank";
      a2.rel = "noopener";
      a2.textContent = "⬇ Baixar";

      const b3 = document.createElement("button");
      b3.className = "btn";
      b3.type = "button";
      b3.textContent = "🔗 Copiar link";
      b3.onclick = async ()=>{
        try{
          await navigator.clipboard.writeText(item.assistente || "");
          showToast("Link copiado!");
        }catch(e){
          showToast("Não consegui copiar. Tente manualmente.");
        }
      };

      actions.appendChild(a1);
      actions.appendChild(a2);
      actions.appendChild(b3);

      body.appendChild(chips);
      body.appendChild(h);
      body.appendChild(p);
      body.appendChild(actions);

      wrap.appendChild(body);
      return wrap;
    }

    function render(){
      elGrid.innerHTML = "";
      const filtered = DATA.filter(matches);
      filtered.forEach(item=> elGrid.appendChild(card(item)));
      elCount.textContent = `${filtered.length} vídeo(s)`;
    }

    async function init(){
      const res = await fetch("videos.json");
      DATA = await res.json();
      buildTabs();
      buildCategoryOptions();
      render();
    }

    elQ.addEventListener("input", render);
    elCat.addEventListener("change", render);

    init();
  </script>
</body>
</html>
