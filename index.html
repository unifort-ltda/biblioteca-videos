<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<title>Biblioteca de Vídeos — Unifort</title>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;margin:0;padding:24px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
header img{height:48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#121a2b;border-radius:14px;overflow:hidden}
.card img{width:100%;height:160px;object-fit:cover;display:block}
.card .p{padding:12px}
small{opacity:.7}
</style>
</head>
<body>
<header>
  <img src="logo-unifort.png" alt="Unifort"/>
  <h2>Biblioteca de Vídeos de Produtos — Unifort</h2>
</header>
<div id="grid" class="grid"></div>
<script>
fetch('videos.json').then(r=>r.json()).then(list=>{
  const g=document.getElementById('grid');
  list.forEach(v=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<img src="${v.thumb}"/><div class="p"><b>${v.produto}</b><br/><small>${v.descricao}</small></div>`;
    g.appendChild(c);
  });
});
</script>
</body>
</html>
