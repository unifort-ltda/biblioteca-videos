<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Biblioteca de vídeos de produtos Unifort.">
  <title>Biblioteca de Vídeos | Unifort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060b13;--panel:#0c1624;--line:#203047;--text:#eff5fb;--muted:#a6b4c5;--brand:#83b951}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#173351 0,transparent 28%),radial-gradient(circle at 93% 5%,#294225 0,transparent 24%),var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}.container{max-width:1280px;margin:auto;padding:26px 20px 56px}header{display:flex;align-items:center;gap:15px}.logo{width:52px;height:52px;object-fit:contain;border-radius:14px;background:#fff;padding:5px}.brand small{color:var(--brand);font-weight:700;letter-spacing:.14em;text-transform:uppercase}.brand h1{font-size:25px;margin:3px 0}.brand p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(12,22,36,.82)}input,select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#08111d;color:var(--text);padding:0 13px;font:inherit}input{flex:1;min-width:220px}select{min-width:190px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:transparent;color:var(--text);cursor:pointer}.tab.active{background:#294c21;border-color:#659348}.meta{color:var(--muted);margin:18px 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#101c2b,#0a121e);box-shadow:0 12px 26px #0004}.thumb{width:100%;height:156px;object-fit:cover;display:block;background:#1c2c3f}.body{padding:13px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 8px;border-radius:99px;background:#213247;color:#dce8f5;font-size:11px}.title{font-size:16px;margin:11px 0 5px}.code{color:var(--brand);font-size:12px}.desc{color:var(--muted);line-height:1.45;font-size:13px;min-height:55px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:9px;background:#17283a;color:var(--text);padding:8px 10px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}.button.primary{background:#63953c;border-color:#83b951;color:#061005}.empty{grid-column:1/-1;padding:38px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.notice{margin:16px 0;padding:12px;border-radius:10px;background:#3b2f12;color:#fde69d}.hidden{display:none}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid{grid-template-columns:1fr}.brand h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="container">
    <header><img class="logo" src="logo-unifort.png" alt="Unifort"><div class="brand"><small>Portal RCA</small><h1>Biblioteca de Vídeos</h1><p>Encontre, assista, baixe e compartilhe conteúdos Unifort.</p></div></header>
    <div id="notice" class="notice hidden"></div>
    <section class="toolbar"><input id="search" type="search" placeholder="Buscar por produto, código ou assunto"><select id="category"><option value="">Todas as categorias</option></select></section>
    <nav id="tabs" class="tabs" aria-label="Segmentos"></nav><p id="count" class="meta">Carregando vídeos…</p><section id="grid" class="grid"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const FALLBACK_URL='videos.json', segments=['Todos']; let videos=[],active='Todos';
    const $=id=>document.getElementById(id), escape=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const config=window.PORTAL_CONFIG||{}; const configured=config.supabaseUrl&&config.supabaseAnonKey&&!config.supabaseUrl.includes('COLE_');
    const db=configured?window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey):null;
    function normalize(v){return {produto:v.produto||v.title,segmento:v.segmento||'Outros',categoria:v.categoria||'Geral',codigo:v.codigo||'',descricao:v.descricao||'',imagem:v.imagem||v.thumbnail_url||'',assistente:v.assistente||v.video_url||'',baixar:v.baixar||v.download_url||''}}
    function tabs(){const values=['Todos',...new Set(videos.map(v=>v.segmento).filter(Boolean))]; $('tabs').innerHTML=values.map(v=>`<button class="tab ${v===active?'active':''}" data-value="${escape(v)}">${escape(v)}</button>`).join(''); document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.value;tabs();render()})}
    function categories(){const current=$('category').value;const values=[...new Set(videos.map(v=>v.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')); $('category').innerHTML='<option value="">Todas as categorias</option>'+values.map(v=>`<option ${v===current?'selected':''}>${escape(v)}</option>`).join('')}
    function render(){const q=$('search').value.trim().toLocaleLowerCase('pt-BR'),cat=$('category').value;const list=videos.filter(v=>{const hay=[v.produto,v.codigo,v.descricao,v.categoria,v.segmento].join(' ').toLocaleLowerCase('pt-BR');return (!q||hay.includes(q))&&(!cat||v.categoria===cat)&&(active==='Todos'||v.segmento===active)});$('count').textContent=`${list.length} vídeo${list.length===1?'':'s'} encontrado${list.length===1?'':'s'}`;$('grid').innerHTML=list.length?list.map(v=>`<article class="card"><img class="thumb" src="${escape(v.imagem)}" alt="${escape(v.produto)}" onerror="this.style.visibility='hidden'"><div class="body"><div class="chips"><span class="chip">${escape(v.segmento)}</span><span class="chip">${escape(v.categoria)}</span></div><h2 class="title">${escape(v.produto)}</h2>${v.codigo?`<p class="code">Código: ${escape(v.codigo)}</p>`:''}<p class="desc">${escape(v.descricao)}</p><div class="actions">${v.assistente?`<a class="button primary" href="${escape(v.assistente)}" target="_blank" rel="noopener">Assistir</a>`:''}${v.baixar?`<a class="button" href="${escape(v.baixar)}" target="_blank" rel="noopener">Baixar</a>`:''}${v.assistente?`<button class="button" data-copy="${escape(v.assistente)}">Copiar link</button>`:''}</div></div></article>`).join(''):'<div class="empty">Nenhum vídeo encontrado com estes filtros.</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent='Link copiado!';setTimeout(()=>b.textContent='Copiar link',1400)}))}
    async function load(){try{if(db){const {data,error}=await db.from('videos').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;videos=data.map(normalize)}else{const r=await fetch(FALLBACK_URL,{cache:'no-store'});videos=(await r.json()).map(normalize);$('notice').textContent='Modo provisório: a biblioteca está exibindo os vídeos atuais. Configure o Supabase para ativar a publicação pelo painel.';$('notice').classList.remove('hidden')}tabs();categories();render()}catch(e){$('count').textContent='Não foi possível carregar os vídeos.';$('grid').innerHTML='<div class="empty">Tente atualizar a página em alguns instantes.</div>';console.error(e)}}
    $('search').oninput=render;$('category').onchange=render;load();
  </script>
</body>
</html>
